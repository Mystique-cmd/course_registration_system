<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Course Registration - Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" data-page="login">
    <section class="auth-card" aria-label="Login">
      <header class="brand">
        <div class="brand-title">Atomicity</div>
      </header>

      <h1 class="headline">Welcome Back</h1>
      <p class="subhead">Enter your university credentials to continue</p>

      <form class="form" id="login-form" autocomplete="on">
        <div class="form-message" id="login-message" hidden></div>
          <label class="field">
          <span class="label">email</span>
          <input class="input" name="email" type="email" placeholder="Your university email..." required />
        </label>


        <label class="field">
          <span class="label">Password</span>
          <input class="input" name="password" type="password" placeholder="••••••••" required />
        </label>

        <div class="row row-between">
          <a class="link" href="#" id="forgot-link">Forgot password?</a>
        </div>

        <button class="btn" type="submit">Sign In to Dashboard</button>

        <div class="divider">
          <span class="divider-text">Or continue with</span>
        </div>

        <div class="alt">
          <a class="link" href="registration.html" id="create-link">Don't have an account? Create one</a>
        </div>

        <script>
          (function () {
            const link = document.getElementById('create-link');
            if (!link) return;
            link.addEventListener('click', (e) => {
              e.preventDefault();
              window.location.assign('registration.html');
            });
          })();
        </script>

      </form>



      <footer class="footer">
        © 2026 CourseReg Inc. All Rights Reserved. Built for higher education excellence.
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
