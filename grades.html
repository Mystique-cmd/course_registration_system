<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Course Registration - Grades</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" data-page="grades">
    <section class="dashboard" aria-label="Student Grades">
      <aside class="sidebar" aria-label="Sidebar navigation">
        <div class="brand-title sidebar-brand">Atomicity</div>

        <nav class="nav" aria-label="Primary">
          <button class="nav-item" type="button" data-nav="dashboard">Dashboard</button>
          <button class="nav-item" type="button" data-nav="browse">Browse Courses</button>
          <button class="nav-item" type="button" data-nav="schedule">Schedule</button>
          <button class="nav-item is-active" type="button" data-nav="grades">Grades</button>
          <button class="nav-item" type="button" data-nav="settings">Settings</button>
        </nav>

        <div class="sidebar-actions">
          <button class="btn btn-ghost" type="button" id="logout-btn">Logout</button>
        </div>
      </aside>

      <div class="dashboard-main">
        <header class="dash-header">
          <div>
            <div class="dash-greeting" id="grades-greeting">Hello, Student</div>
            <div class="dash-sub" id="grades-program">Program</div>
          </div>
        </header>

        <div class="grid" style="grid-template-columns: 1fr;">
          <section class="card" aria-label="Grades">
            <h2 class="card-title">Grades</h2>
            <div class="table" role="table" aria-label="Grades table">
              <div class="thead" role="row">
                <div role="columnheader">Course</div>
                <div role="columnheader">KCSE Grade</div>
                <div role="columnheader">Status</div>
              </div>
              <div class="tbody" id="grades-list" role="rowgroup"></div>
            </div>
            <div class="muted small" id="grades-empty" style="margin-top:12px;">No grades available yet.</div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.__API_BASE__ = (window.__API_BASE__ || '').trim() || 'https://YOUR_BACKEND_DOMAIN_HERE';
  </script>
  <script src="app.js"></script>
  <script>
    window.__STUDENT_PAGE_SYNC__ = true;
  </script>
</body>
</html>
