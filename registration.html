<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Course Registration - Create Account</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" data-page="register">
    <section class="auth-card" aria-label="Registration">
      <header class="brand">
        <div class="brand-title">Atomicity</div>
      </header>

      <h1 class="headline">Course Registration</h1>
      <p class="subhead">Create your account and enroll in a course</p>

      <form class="form" id="register-form" autocomplete="on">
        <div class="form-message" id="register-message" hidden></div>

        <label class="field">
          <span class="label">student name</span>
          <input class="input" name="studentName" type="text" placeholder="Your full name..." required />
        </label>

        <label class="field">
          <span class="label">Email Address</span>
          <input class="input" name="email" type="email" placeholder="name@university.edu" required />
        </label>

        <label class="field">
          <span class="label">Password</span>
          <input class="input" name="password" type="password" placeholder="••••••••" required />
        </label>

        <label class="field">
          <span class="label">course name</span>
          <select class="input" name="courseName" required>
            <option value="" disabled selected>Select a course</option>
            <option>Computer Science</option>
            <option>Data Structures</option>
            <option>Advanced React Patterns</option>
            <option>Business Administration</option>
            <option>Engineering Fundamentals</option>
          </select>
        </label>

        <label class="field">
          <span class="label">KCSE grade</span>
          <input class="input" name="kcse" type="text" placeholder="Mean Grade..." required />
        </label>

        <button class="btn" type="submit">Complete Registration</button>

        <div class="alt">
          <a class="link" href="login.html" id="view-login-link">Already registered? Sign in</a>
        </div>

        <script>
          (function () {
            const link = document.getElementById('view-login-link');
            if (!link) return;
            link.addEventListener('click', (e) => {
              e.preventDefault();
              window.location.assign('login.html');
            });
          })();
        </script>
      </form>

      <footer class="footer">
        © 2026 CourseReg Inc. All Rights Reserved. Built for higher education excellence.
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
